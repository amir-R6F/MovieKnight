[pytest]
testpaths = tests
# Opt-in tests: run them explicitly with  pytest -m real_mpv
addopts = -m "not real_mpv"
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 30
timeout_method = thread
markers =
    real_mpv: needs a real mpv binary on this machine (skipped by default)
filterwarnings =
    ignore::DeprecationWarning:websockets.*
